name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Corrida completa cada noche, y a pedido desde la pestaña Actions ("Run
  # workflow", sobre cualquier rama): los e2e en los 3 navegadores. No
  # despliega nada: cd.yml solo sigue a las corridas de CI cuyo evento es
  # "push" a main.
  schedule:
    - cron: "0 6 * * *" # 01:00 en Lima (UTC-5)
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Imágenes desde el espejo de Google de Docker Hub (mismas imágenes
      # oficiales): Docker Hub y AWS ECR Public cortan las descargas sin
      # sesión (toomanyrequests) en los runners compartidos y tumbaban
      # "Initialize containers" al azar.
      postgres:
        image: mirror.gcr.io/library/postgres:16
        # POSTGRES_USER queda como "postgres" (el bootstrap por default) a
        # propósito: Postgres exige que el bootstrap user tenga SUPERUSER
        # ("The bootstrap user must have the SUPERUSER attribute") y lo
        # rechaza si se intenta sacárselo con ALTER ROLE — así que
        # mincoreerp_app NO puede ser el bootstrap. Se crea aparte, como
        # rol de aplicación normal, en el paso "Crear el rol de la app"
        # de abajo. Ver ese paso para el motivo completo.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mincoreerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Sin esto, todo lo que depende de Redis (sesiones revocables de
      # platform_admin, dedupe de auditoría, idempotency-key, los rate
      # limiters específicos) corre en su modo degradado sin Redis en
      # cada CI run — nunca se prueba de punta a punta el camino real,
      # solo el de fallback. Efímero, se borra al terminar el job, igual
      # que Postgres arriba.
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No son secretos reales: Postgres/Redis son contenedores efímeros
      # que se borran al terminar el job, y estos valores nunca tocan
      # producción.
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_EXPIRES: 30m
      SESSION_TTL_SECONDS: 2592000
      AUTH_COOKIE_NAME: erp_token
      PLATFORM_ADMIN_TOKEN: ci-only-not-a-real-secret
      # Claves de cifrado — 32 bytes en base64, que es lo que exigen
      # platformCrypto.ts y backupCrypto.ts (si no decodifican a 32 bytes
      # tiran 500, y si faltan tiran 503). Valores fijos y públicos a
      # propósito: solo cifran datos efímeros que se crean y se borran
      # dentro del propio job, igual que JWT_SECRET de arriba.
      #
      # APP_ENCRYPTION_KEY faltaba desde que se implementó SSO por tenant
      # (0cfa919): sin ella, configurarSsoTenantService responde 503 y los
      # 7 tests de tests/tenant-sso.test.ts fallan. Esos tests nunca
      # llegaron a correr en verde en CI porque se agregaron después de la
      # última corrida exitosa.
      APP_ENCRYPTION_KEY: Y2ktb25seS1hcHAta2V5LTMyLWJ5dGVzLWV4YWN0ISE=
      # BACKUP_ENCRYPTION_KEY la exige tests/platform-backup-s3.test.ts,
      # que corre con driver s3 (contra un bucket falso en memoria) — y con
      # ese driver el cifrado de cliente es obligatorio y falla cerrado.
      BACKUP_ENCRYPTION_KEY: Y2ktb25seS1iYWNrdXAta2V5LTMyLWJ5dGVzLW9rISE=
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: mincoreerp_app
      PG_PASSWORD: ci_only_password
      PG_DATABASE: mincoreerp
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 1000
      # La suite entera pega contra /api/erp/*; con los defaults de producción
      # los tests se bloquearían entre sí. tests/erp-rate-limit.test.ts baja
      # estos valores en runtime para probar el comportamiento real.
      ERP_RATE_LIMIT_USUARIO_MAX: 100000
      ERP_RATE_LIMIT_TENANT_DEFAULT: 100000
      # Con Redis real (arriba), estos dos son de verdad compartidos entre
      # TODOS los archivos de test dentro del mismo run (a diferencia del
      # fallback en memoria, que queda aislado por worker) — la suite crea
      # decenas de tenants de prueba en total, muy por encima del default
      # de producción (5 cada 15 min), así que sin esto CI empezaría a
      # devolver 429 a mitad de la corrida.
      PLATFORM_TENANT_CREATION_WINDOW_MS: 60000
      PLATFORM_TENANT_CREATION_MAX_REQUESTS: 1000
      PLATFORM_ADMIN_LOGIN_WINDOW_MS: 60000
      PLATFORM_ADMIN_LOGIN_MAX_REQUESTS: 1000
      # Mismo motivo que los dos de arriba: tests/auth.test.ts (y cualquier
      # otro que loguee al mismo usuario de prueba varias veces) chocaría
      # contra el default de producción (10/hora) mucho antes de terminar
      # la suite.
      LOGIN_EMAIL_RATE_LIMIT_WINDOW_MS: 60000
      LOGIN_EMAIL_RATE_LIMIT_MAX_REQUESTS: 1000
      FORGOT_PASSWORD_EMAIL_RATE_LIMIT_WINDOW_MS: 60000
      FORGOT_PASSWORD_EMAIL_RATE_LIMIT_MAX_REQUESTS: 1000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          # Ver el comentario del mismo paso en e2e-tests.
          REDISMS_DISABLE_POSTINSTALL: 1

      - name: Auditoría de dependencias (falla con high/critical)
        run: npm audit --audit-level=high

      - name: Crear el rol de la app (no superuser, como en producción)
        # La imagen oficial postgres:16 crea el rol de POSTGRES_USER como
        # SUPERUSER al inicializar — y un superuser en Postgres se salta
        # Row Level Security SIEMPRE, sin importar FORCE ROW LEVEL
        # SECURITY. Si mincoreerp_app fuera ese mismo rol bootstrap,
        # quedaría superuser en CI (a diferencia de producción, donde no
        # lo es — verificado), y todos los tests de aislamiento entre
        # tenants pasarían igual aunque RLS esté completamente inerte: el
        # filtro explícito `WHERE tenant_id = $1` que ya lleva cada query
        # (defensa en profundidad, ver database-performance-guidelines.md)
        # sigue aislando por su cuenta y tapa el problema. Se detectó
        # porque tests/partitioning.test.ts consulta una partición sin ese
        # filtro, a propósito, para probar RLS aislado — y falló 10/10
        # veces contra un Postgres 16 fresco con mincoreerp_app como
        # bootstrap, nunca contra uno donde es un rol separado no-superuser
        # como este.
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -p 5432 -U postgres -d mincoreerp <<'SQL'
            CREATE ROLE mincoreerp_app WITH LOGIN PASSWORD 'ci_only_password';
            ALTER DATABASE mincoreerp OWNER TO mincoreerp_app;
            ALTER SCHEMA public OWNER TO mincoreerp_app;
          SQL

      - name: Correr migraciones
        # Mismo runner que corre en producción al arrancar (ver
        # src/server/config/migrate.ts) — así CI prueba el camino real,
        # no un loop de psql aparte que se puede desincronizar.
        run: npm run migrate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests + coverage mínimo (incluye aislamiento entre tenants vía RLS)
        run: npm run test:coverage

      - name: Subir cobertura a Codecov
        # Solo reporting: fail_ci_if_error en false a propósito. Este
        # workflow alimenta el deploy (cd.yml dispara por workflow_run al
        # ver "CI" en success) — un blip de red o rate-limit del lado de
        # Codecov no debe tumbar este job ni bloquear producción. El gate
        # duro de cobertura sigue siendo el threshold de vitest.config.mts
        # en el step de arriba, que si falla sí corta el job.
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      - name: Auditoría de dependencias (falla con high/critical)
        working-directory: client
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: client
        run: npx tsc --noEmit

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build de producción
        working-directory: client
        run: npm run build

  # El "E2E" del flujo Lint => Test => Build => E2E => Deploy — la simulación
  # real de un usuario en el navegador, contra el sistema completo (Express +
  # build de React + Postgres + Redis), no un mock.
  #
  # Corre EN PARALELO con backend y frontend, no después: tiene su propia base
  # y su propio build, no usa nada que esos jobs produzcan, y esperarlos
  # sumaba sus ~11 min al tiempo total del CI. El deploy no cambia: CD solo
  # arranca si el workflow "CI" completo (workflow_run) termina en success, y
  # eso incluye este job. Si backend o frontend fallan, este igual corre: se
  # gastan minutos, pero el repo es público y no cuestan.
  e2e-tests:
    runs-on: ubuntu-latest
    # Un PR normal tarda ~4 min aquí y la corrida de noche (3 navegadores)
    # bastante menos de 20. Sin tope, un servidor de paquetes colgado dejó este
    # job 30 min y habría seguido hasta las 6 h.
    timeout-minutes: 20
    # Corre dentro de la imagen oficial de Playwright, que ya trae los 3
    # navegadores y sus librerías de sistema. Antes se instalaban en cada corrida
    # con `playwright install --with-deps`, que baja ~100 paquetes del servidor
    # de Ubuntu (azure.archive.ubuntu.com): se colgó 30 min en #322 y volvió a
    # irse de tiempo en #332. La versión de la imagen TIENE que ser la de
    # @playwright/test (lo comprueba el paso "Comprobar la imagen de Playwright").
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Recomendado por Playwright para Chromium en contenedores.
      options: --ipc=host
    # En un job con contenedor, GitHub usa `sh` (dash) para los `run` si no se le
    # dice otra cosa, y el paso de los specs tocados necesita bash (pipefail, mapfile).
    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mincoreerp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mismos valores efímeros que el job "backend" — ver los comentarios
      # de ese job para el porqué de cada uno (rol no-superuser para RLS,
      # claves de cifrado de 32 bytes, etc.), no se repiten acá.
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_EXPIRES: 30m
      SESSION_TTL_SECONDS: 2592000
      AUTH_COOKIE_NAME: erp_token
      PLATFORM_ADMIN_TOKEN: ci-only-not-a-real-secret
      APP_ENCRYPTION_KEY: Y2ktb25seS1hcHAta2V5LTMyLWJ5dGVzLWV4YWN0ISE=
      BACKUP_ENCRYPTION_KEY: Y2ktb25seS1iYWNrdXAta2V5LTMyLWJ5dGVzLW9rISE=
      # Dentro del contenedor los servicios se alcanzan por su nombre, no por localhost.
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: mincoreerp_app
      PG_PASSWORD: ci_only_password
      PG_DATABASE: mincoreerp
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Tenant y usuario que este job siembra directo en la BD efímera (ver
      # paso "Sembrar tenant y usuario de prueba") para que login.spec.ts
      # tenga con quién loguearse — no es un secreto real, la BD se borra
      # al terminar el job.
      E2E_TENANT_SLUG: e2e
      E2E_ADMIN_NOMBRE: E2E Admin
      E2E_ADMIN_EMAIL: e2e@mincoreerp.test
      E2E_ADMIN_PASSWORD: E2eTestPass!2026
      # Segundo tenant, para aislamiento-tenants.spec.ts: sin datos ajenos
      # que intentar alcanzar no hay nada que probar. Este NO entra por la
      # UI (el slug horneado en el bundle es el de arriba) — el spec lo
      # maneja por API.
      E2E_TENANT_B_SLUG: e2e-b
      E2E_ADMIN_B_NOMBRE: E2E Admin B
      E2E_ADMIN_B_EMAIL: e2e-b@mincoreerp.test
      E2E_ADMIN_B_PASSWORD: E2eTestPassB!2026
      # El rate limiter de /login cuenta por `form:<path>:<ip>` (ver
      # rateLimiter.ts): no distingue usuario ni tenant, así que TODOS los
      # logins del job comparten un mismo contador. Los 3 navegadores del
      # config corren en paralelo y cada spec loguea —el de aislamiento dos
      # veces, una por tenant— así que son 9 intentos en menos de un minuto
      # contra un default de 5/min. El tercer navegador se come un 429 y el
      # job falla por algo que no tiene nada que ver con lo que se está
      # probando (pasó con WebKit, pero le habría tocado a cualquiera: es el
      # último en correr, no el culpable).
      #
      # Subirlo acá no debilita nada: el rate limiter tiene su propia
      # cobertura en tests/erp-rate-limit.test.ts, donde SÍ es el sujeto del
      # test. Acá solo estorba.
      RATE_LIMIT_MAX_REQUESTS: 100
      # Mismo problema, otra causa: LOGIN_EMAIL_RATE_LIMIT_MAX_REQUESTS es
      # por tenantSlug+email, no por IP -- los 9 logins de arriba son casi
      # todos contra el mismo E2E_ADMIN_EMAIL, muy cerca del default de
      # producción (10/hora). Un reintento de CI (retries: 1) alcanzaría
      # para superarlo.
      LOGIN_EMAIL_RATE_LIMIT_MAX_REQUESTS: 100
      # Tercera vez el mismo problema, tercera causa distinta -- y esta es
      # la que más va a repetirse, así que vale entenderla bien.
      #
      # erpRateLimiter cuenta por USUARIO (ver el comentario largo de
      # erpRateLimiter.ts sobre por qué no por IP), con un default de
      # producción de 120 req/min. TODOS los specs entran con el mismo
      # E2E_ADMIN_EMAIL y los 3 navegadores corren en paralelo: los tres
      # comparten ese presupuesto. Cada spec de checklists gasta ~10
      # requests al ERP entre prerrequisitos por API, cargas del formulario
      # y envíos.
      #
      # Con dos specs de checklists el total quedaba justo por debajo de
      # 120. Al sumar el tercero (capa-b-cliente-uuid) se pasó, y WebKit
      # -que corre último- se comió los 429: fallaron los TRES specs de
      # checklists, incluidos dos que no se habían tocado. El síntoma
      # engaña, porque parece que rompió el spec nuevo cuando en realidad
      # solo movió el total.
      #
      # A diferencia de los dos de arriba, este NO estaba puesto acá: el
      # default de 120 ya alcanzaba. Se fija alto para que deje de ser el
      # techo que hay que recalcular cada vez que se agrega un spec. Mismo
      # argumento que arriba: el limitador tiene su propia cobertura en
      # tests/erp-rate-limit.test.ts, donde SÍ es el sujeto del test.
      #
      # El límite por TENANT (ERP_RATE_LIMIT_TENANT_DEFAULT, 3000) no hace
      # falta tocarlo: el job entero no se acerca a ese número.
      ERP_RATE_LIMIT_USUARIO_MAX: 5000
      # "true" de noche o a pedido (los 3 navegadores); "false" en cada PR y
      # en cada push a main (chromium, y webkit solo para @celular).
      CORRIDA_COMPLETA: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: el paso "E2E de los specs tocados" compara
          # contra la rama base del PR.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          # redis-memory-server compila Redis desde el código fuente en su
          # postinstall (3 min 40 s sin una línea de salida). Acá no se usa:
          # tests/global-setup.redis.ts prefiere el Redis real de REDIS_HOST,
          # que este job y el de backend ya traen como servicio.
          REDISMS_DISABLE_POSTINSTALL: 1

      - name: Comprobar la imagen de Playwright
        # Si Dependabot sube @playwright/test y la imagen del job queda atrás,
        # Playwright falla con "Executable doesn't exist", que no dice qué hacer.
        # Se mira directamente si la imagen trae los navegadores que esta versión
        # necesita (el contexto `job.container` no expone el nombre de la imagen).
        run: |
          node -e "
            const fs = require('fs');
            const dir = process.env.PLAYWRIGHT_BROWSERS_PATH;
            const { browsers } = JSON.parse(fs.readFileSync('node_modules/playwright-core/browsers.json', 'utf8'));
            const faltan = browsers
              .filter((b) => ['chromium', 'firefox', 'webkit'].includes(b.name))
              .filter((b) => !fs.existsSync(dir + '/' + b.name + '-' + b.revision))
              .map((b) => b.name + '-' + b.revision);
            if (faltan.length > 0) {
              const v = require('@playwright/test/package.json').version;
              console.log('::error::La imagen del job no trae los navegadores de @playwright/test v' + v + ' (faltan: ' + faltan.join(', ') + '). Cambia el tag de container.image en e2e-tests a v' + v + '-noble.');
              process.exit(1);
            }
          "

      - name: Crear el rol de la app (no superuser, como en producción)
        # La imagen de Playwright no trae psql: se hace con el cliente `pg` del
        # proyecto. Mismas tres sentencias que en el job "backend".
        run: |
          node --input-type=module -e "
            import pg from 'pg';
            const c = new pg.Client({ host: process.env.PG_HOST, user: 'postgres', password: 'ci_only_password', database: 'mincoreerp' });
            await c.connect();
            await c.query(\"CREATE ROLE mincoreerp_app WITH LOGIN PASSWORD 'ci_only_password'\");
            await c.query('ALTER DATABASE mincoreerp OWNER TO mincoreerp_app');
            await c.query('ALTER SCHEMA public OWNER TO mincoreerp_app');
            await c.end();
          "

      - name: Correr migraciones
        run: npm run migrate

      - name: Sembrar tenant y usuario de prueba
        run: |
          npm run tenant:create -- \
            --tenantNombre="E2E Test" \
            --tenantSlug="$E2E_TENANT_SLUG" \
            --adminNombre="$E2E_ADMIN_NOMBRE" \
            --adminEmail="$E2E_ADMIN_EMAIL" \
            --adminPassword="$E2E_ADMIN_PASSWORD" \
            --sinCambioObligatorio

      - name: Sembrar segundo tenant (para el spec de aislamiento)
        run: |
          npm run tenant:create -- \
            --tenantNombre="E2E Test B" \
            --tenantSlug="$E2E_TENANT_B_SLUG" \
            --adminNombre="$E2E_ADMIN_B_NOMBRE" \
            --adminEmail="$E2E_ADMIN_B_EMAIL" \
            --adminPassword="$E2E_ADMIN_B_PASSWORD" \
            --sinCambioObligatorio

      - name: Instalar dependencias del frontend
        working-directory: client
        run: npm ci

      - name: Build del frontend (con el tenant de prueba ya resuelto)
        # VITE_DEFAULT_TENANT_SLUG queda horneado en el build: así el login
        # no muestra el campo manual "Empresa" y prueba el mismo camino por
        # el que entra un cliente real vía su propio subdominio, en vez del
        # fallback manual que hoy solo usa el dueño de la plataforma.
        working-directory: client
        run: npm run build
        env:
          VITE_DEFAULT_TENANT_SLUG: ${{ env.E2E_TENANT_SLUG }}

      # Qué corre dónde (tags @celular y @inestable): ver playwright.config.ts.
      # playwright.config.ts arranca "npm start" solo (webServer) y espera a
      # que /health responda antes de disparar los tests — ver ese archivo
      # para el detalle.
      - name: E2E chromium (todos los specs)
        if: env.CORRIDA_COMPLETA != 'true'
        run: npx playwright test --project=chromium --grep-invert=@inestable

      # Un spec que pasa una vez por suerte es el que después falla de a
      # ratos: se repite 5 veces seguidas, sin reintentos y de a uno. Solo en
      # PR (en main y de noche no hay contra qué comparar). Si no se puede
      # calcular qué cambió, el paso FALLA: repetir todos los specs 5 veces
      # no es una alternativa razonable, y saltarlo en silencio dejaría pasar
      # justo lo que este paso existe para atrapar.
      - name: E2E de los specs tocados (5 veces seguidas)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          mapfile -t specs < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'e2e/*.spec.ts')
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "Ningún spec creado o modificado en este PR."
            exit 0
          fi
          printf 'Specs tocados:\n%s\n' "${specs[@]}"
          npx playwright test --project=chromium --repeat-each=5 --retries=0 --workers=1 \
            --grep-invert=@inestable --pass-with-no-tests "${specs[@]}"

      - name: E2E webkit (pantallas de celular)
        if: env.CORRIDA_COMPLETA != 'true'
        run: npx playwright test --project=webkit --grep=@celular --grep-invert=@inestable --pass-with-no-tests

      - name: E2E completo (los 3 navegadores)
        if: env.CORRIDA_COMPLETA == 'true'
        run: npx playwright test --grep-invert=@inestable

      # La cuarentena corre después de lo que sí bloquea, con su propio
      # reporte para no pisar el de arriba, y si falla solo deja un aviso.
      - name: E2E en cuarentena (no bloquea)
        id: cuarentena
        continue-on-error: true
        run: |
          if [ "$CORRIDA_COMPLETA" = "true" ]; then
            npx playwright test --grep=@inestable --pass-with-no-tests
          else
            npx playwright test --project=chromium --grep=@inestable --pass-with-no-tests
          fi
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-cuarentena

      - name: Avisar que falló la cuarentena
        if: steps.cuarentena.outcome == 'failure'
        run: echo "::warning title=E2E en cuarentena::Falló un test con tag @inestable. No bloquea el merge; el reporte quedó en el artefacto playwright-report-cuarentena."

      - name: Subir reporte de la cuarentena si falló
        if: steps.cuarentena.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-cuarentena
          path: playwright-report-cuarentena/
          retention-days: 7

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
